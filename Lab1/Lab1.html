<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Практична робота №1</title>
</head>
<body>
    <h1>Завдання 1: Перевірка логіна</h1>

    <script>
        let userName = prompt("Хто там?");

        if (userName === "Admin") {
            let password = prompt("Пароль?");

            if (password === "Господар") {
                alert("Ласкаво просимо!");
            } else if (password === "" || password === null) {
                alert("Скасовано");
            } else {
                alert("Неправильний пароль");
            }

        } else if (userName === "" || userName === null) {
            alert("Скасовано");
        } else {
            alert("Я вас не знаю");
        }
    </script>
</body>
</html>
